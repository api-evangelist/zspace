note: >-
  zspace.com, developer.zspace.com and login.zspace.com are client-side Angular
  applications whose origin answers HTTP 200 with the same SPA shell for EVERY path,
  including nonsense paths. Every /.well-known/* 200 recorded on those three hosts is a
  soft-404 HTML shell, NOT a served document, and is marked served: false. The only real
  discovery documents zSpace publishes are the Keycloak OpenID Connect metadata and JWKS
  on auth.zspace.com (production) and auth.devqastage.zspace.com, which are served from
  the realm path rather than the host root.
