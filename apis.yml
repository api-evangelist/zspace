- aid: zspace:zspace-developer-api
  name: zSpace Developer Portal API (v2)
  description: The web API behind the zSpace developer portal and account surface, served from api.zspace.com/v2
    and named as apiUrlV2 in the portal's own published runtime configuration. It is a Node/NestJS service
    exposing auth, cognito, devportal, gateway and social route groups. A Swagger UI is mounted at /v2/api/docs
    but is protected by the zSpace Keycloak OpenID Connect provider, so no machine-readable OpenAPI is
    publicly retrievable.
  image: https://cdn.zspace.com/website-images/zspace-logo.png
