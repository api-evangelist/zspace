apis:
- aid: zspace:zspace-core-sdk
  name: zSpace Core SDK (Native C API)
  description: 'The zSpace Core SDK is a native C API (documented as native_sdk_4.0) that lets an application
    drive a zSpace display: it loads the SDK runtime, detects connected peripherals, and exposes fourteen
    API modules covering displays, stereo buffers and viewports, coordinate spaces, the stereo frustum,
    tracker devices and tracker targets, target buttons, LEDs, vibration and tap, tracker events, and
    mouse emulation. A Unity plugin wraps the same surface. It is a device/runtime SDK, not a web service.'
  image: https://cdn.zspace.com/website-images/zspace-logo.png
  humanURL: https://developer.zspace.com/docs/native-sdk/guide
  baseURL: https://developer.zspace.com/assets/sdk-manual/
