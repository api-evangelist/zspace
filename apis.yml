aid: zspace
name: zSpace
description: 'zSpace, Inc. (Nasdaq: ZSPC) builds AR/VR learning technology for K-12, career and technical
  education, and higher education — glasses-free 3D laptops and all-in-one displays (Inspire, Imagine,
  AIO Pro) paired with a stylus, head tracking, and a catalog of curriculum-aligned applications, models
  and simulations. Its developer surface is centered on the zSpace Core SDK, a native C API plus a Unity
  plugin that gives applications access to the display''s stereo frustum, coordinate spaces, tracker devices
  and targets, stylus buttons, LED and haptics. A first-party developer portal at developer.zspace.com
  fronts an authenticated web API at api.zspace.com/v2 and a Keycloak OpenID Connect identity provider
  at auth.zspace.com; product release notes for roughly thirty applications are published from a public
  updates.zspace.com bucket. zSpace is a publicly traded company (Nasdaq: ZSPC) headquartered in San Jose,
  California with more than 70 patents, and reports over 2,400 U.S. school, technical-center, community-college
  and university customers.'
